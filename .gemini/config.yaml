# Gemini Code Assist — настройки ревью PR.
# Схема: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true
