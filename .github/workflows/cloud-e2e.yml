name: cloud-e2e

# Сквозная проверка на настоящем Cloud.ru: init → deploy → verify → logs -f →
# destroy. Создаёт платную ВМ и floating IP, поэтому запускается только
# вручную или пушем в ветку e2e/** — и всегда удаляет за собой ресурсы.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDRU_KEY_ID, CLOUDRU_SECRET — ключ тестового сервисного аккаунта
#   CLOUDRU_PROJECT_ID             — тестовый проект

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Availability zone name (ru.AZ-1 зависал в creating 14.10.2026)"
        default: "ru.AZ-2"
      flavor:
        description: "Flavor name"
        default: "lowcost10-2-4"
      image:
        description: "Image name"
        default: "ubuntu-22.04"
  push:
    branches: ["e2e/**"]

concurrency:
  group: cloud-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      FLAVOR: ${{ inputs.flavor || 'lowcost10-2-4' }}
      IMAGE: ${{ inputs.image || 'ubuntu-22.04' }}
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: go.sum

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/cloudru-vm" ./cmd/cloudru-vm && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Проверка секретов
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing CLOUDRU_KEY_ID"
          [ -n "$SECRET" ] || missing="$missing CLOUDRU_SECRET"
          [ -n "$PROJECT" ] || missing="$missing CLOUDRU_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::нет секретов репозитория:$missing"; exit 1; fi

      - name: configure + whoami
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          printf '%s' "$SECRET" | cloudru-vm configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT"
          cloudru-vm whoami

      - name: Тестовый проект
        run: |
          mkdir -p e2e-app
          printf 'services:\n  web:\n    image: nginx:alpine\n    ports:\n      - "80:80"\n' > e2e-app/docker-compose.yml

      - name: init, затем зона/образ/flavor из входов
        working-directory: e2e-app
        run: |
          cloudru-vm init --non-interactive
          zone_id=$(cloudru-vm list-zones --json | jq -r --arg n "$ZONE" '.[] | select(.name==$n) | .id')
          image_id=$(cloudru-vm list-images --json | jq -r --arg n "$IMAGE" '[.[] | select(.name==$n)][0].id')
          [ -n "$zone_id" ] && [ "$zone_id" != null ] || { echo "::error::зона $ZONE не найдена"; exit 1; }
          [ -n "$image_id" ] && [ "$image_id" != null ] || { echo "::error::образ $IMAGE не найден"; exit 1; }
          sed -i -e "s|^region:.*|region: $zone_id|" -e "s|^image_id:.*|image_id: $image_id|" -e "s|^flavor:.*|flavor: $FLAVOR|" .cloudru-vm.yaml
          grep -E '^(region|image_id|flavor):' .cloudru-vm.yaml

      - name: deploy --dry-run (ничего не создаёт)
        working-directory: e2e-app
        run: |
          cloudru-vm deploy --dry-run
          [ ! -s .cloudru-vm/state.json ] || ! jq -e '.deployments | length > 0' .cloudru-vm/state.json

      - name: deploy --yes
        working-directory: e2e-app
        run: cloudru-vm deploy --yes

      - name: verify и HTTP снаружи
        working-directory: e2e-app
        run: |
          cloudru-vm verify
          ip=$(jq -r '.deployments[0].vm_ip' .cloudru-vm/state.json)
          curl -fsS --max-time 15 "http://$ip/" | grep -qi nginx

      - name: logs -f дольше 120 с, Ctrl-C → 130
        working-directory: e2e-app
        run: |
          set +e
          timeout --preserve-status -s INT 150 cloudru-vm logs -f > logs.txt 2>&1
          rc=$?
          set -e
          tail -5 logs.txt
          [ "$rc" = 130 ] || { echo "::error::logs -f: код $rc, ожидался 130"; exit 1; }

      - name: destroy --yes (всегда)
        if: always()
        run: |
          cd e2e-app 2>/dev/null && [ -f .cloudru-vm/state.json ] || { echo "нечего удалять"; exit 0; }
          for i in 1 2 3; do cloudru-vm destroy --yes && break; sleep 30; done
          jq -e '.deployments | length == 0' .cloudru-vm/state.json
