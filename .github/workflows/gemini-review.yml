name: gemini-review

# Ревью PR моделью Gemini по команде `/argon review` в комментарии к PR.
# Запустить может только владелец репозитория: у job есть секрет
# GEMINI_API_KEY. issue_comment всегда работает на ветке по умолчанию, поэтому
# скрипт и styleguide берутся из main; PR читается только как данные (git diff),
# его код не выполняется. Модель получает текст и возвращает текст — никаких
# инструментов и токенов у неё нет.
#
# Секрет: GEMINI_API_KEY (Google AI Studio). Переменная (необязательно):
# GEMINI_MODEL — id модели, по умолчанию gemini-pro-latest.

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: gemini-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/argon review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ревью
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ vars.GEMINI_MODEL || 'gemini-pro-latest' }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: .github/scripts/gemini-review.sh
