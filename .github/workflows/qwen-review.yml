name: qwen-review

# Ревью PR моделью Qwen из Cloud.ru Foundation Models по команде
# `/qwen review` в комментарии к PR. Запустить может только владелец
# репозитория: у job есть секрет CLOUDRU_FM_API_KEY. issue_comment всегда
# работает на ветке по умолчанию, поэтому скрипт и review-guide берутся из
# main; PR читается только как данные (git diff), его код не выполняется.
# Модель получает текст и возвращает текст — никаких инструментов и токенов.
#
# Секрет: CLOUDRU_FM_API_KEY. Переменные (необязательно): QWEN_MODEL — id
# модели, FM_BASE_URL — OpenAI-совместимый адрес Foundation Models.

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: qwen-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/qwen review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ревью
        env:
          GH_TOKEN: ${{ github.token }}
          FM_API_KEY: ${{ secrets.CLOUDRU_FM_API_KEY }}
          FM_BASE_URL: ${{ vars.FM_BASE_URL || 'https://foundation-models.api.cloud.ru/v1' }}
          MODEL: ${{ vars.QWEN_MODEL || 'Qwen/Qwen3.5-397B-A17B' }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: .github/scripts/qwen-review.sh
