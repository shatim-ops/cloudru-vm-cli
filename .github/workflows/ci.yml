name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 1.26.5 закрывает GO-2026-5856 (crypto/tls) и GO-2026-4970 (os).
          # Ниже не опускать без проверки govulncheck.
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...

      # Форматирование проверяем отдельно: gofmt молча ничего не возвращает,
      # поэтому непустой вывод и есть провал.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - run: go test -race -count=1 ./...

      # Не для галочки. 12.08.2026 здесь нашлись пять достижимых уязвимостей в
      # x/crypto/ssh — тем самым коде, которым движок ходит на ВМ, включая обход
      # физического подтверждения FIDO/U2F. Все пришли обновлением зависимости,
      # а не правкой кода: поймать такое можно только регулярным прогоном.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
